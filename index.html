<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>せどりノート</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2129;--sub:#6b7280;--accent:#e4572e;--ok:#15803d;--ng:#b91c1c;--line:#e5e7eb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111318;--card:#1c1f26;--text:#eceef2;--sub:#9aa3b2;--line:#2c313c}}
:root[data-theme="dark"]{--bg:#111318;--card:#1c1f26;--text:#eceef2;--sub:#9aa3b2;--line:#2c313c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;padding:0 0 76px}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:#fff;padding:12px 16px;font-weight:700;font-size:18px}
header button{background:#fff;color:var(--accent);border:0;border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
main{padding:12px 16px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;padding:12px 0;border:0;background:none;color:var(--sub);font-size:13px;cursor:pointer}
nav button.on{color:var(--accent);font-weight:700}
section{display:none}
section.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.stat .v{font-size:20px;font-weight:700}
.stat .l{font-size:12px;color:var(--sub)}
.pos{color:var(--ok)} .neg{color:var(--ng)}
.item{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;cursor:pointer}
.item+.item{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.item .name{font-weight:600;word-break:break-all}
.item .r{text-align:right;font-size:13px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;background:var(--line);color:var(--sub);margin:4px 4px 0 0}
.st-stock{background:#e0e7ff;color:#3730a3}.st-listed{background:#fef3c7;color:#92400e}.st-sold{background:#dcfce7;color:#166534}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools input,.tools select{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:15px}
.empty{color:var(--sub);text-align:center;padding:24px 0}
.btn{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--ng)}
dialog{width:min(92vw,480px);border:0;border-radius:14px;padding:0;background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px}
dialog h2{margin:0 0 12px;font-size:18px}
dialog label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px}
dialog textarea{min-height:60px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{margin:12px 0;padding:10px;border-radius:8px;background:var(--bg);font-size:14px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.actions .spacer{flex:1}
.fee-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.fee-row input{width:90px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);text-align:right;font-size:16px}
.note{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<header>
  <span>せどりノート</span>
  <button id="addBtn" type="button">＋ 追加</button>
</header>

<main>
  <!-- ホーム -->
  <section id="v-home" class="on">
    <div class="grid" id="stats"></div>
    <div class="card">
      <strong>直近の売却</strong>
      <div id="recent"></div>
    </div>
  </section>

  <!-- 商品一覧 -->
  <section id="v-list">
    <div class="tools">
      <input id="q" type="search" placeholder="商品名・仕入れ先で検索">
      <select id="f">
        <option value="all">すべて</option>
        <option value="stock">在庫</option>
        <option value="listed">出品中</option>
        <option value="sold">売却済</option>
      </select>
    </div>
    <div class="tools">
      <button class="btn primary" id="mailBtn" type="button">📧 メールから取り込み</button>
    </div>
    <div class="card" id="list"></div>
  </section>

  <!-- 設定 -->
  <section id="v-set">
    <div class="card">
      <strong>販売先ごとの手数料率（%）</strong>
      <div id="fees"></div>
      <p class="note">初期値は目安です。実際の手数料率は各サービスの最新情報で確認して変更してください。</p>
    </div>
    <div class="card">
      <strong>データ</strong>
      <div class="actions" style="justify-content:flex-start;margin-top:8px">
        <button class="btn" id="csv" type="button">CSVで書き出す</button>
        <button class="btn danger" id="reset" type="button">全データ削除</button>
      </div>
      <p class="note">データはこの端末のブラウザ内（localStorage）に保存されます。</p>
    </div>
  </section>
</main>

<nav>
  <button data-view="v-home" class="on" type="button">ホーム</button>
  <button data-view="v-list" type="button">商品一覧</button>
  <button data-view="v-set" type="button">設定</button>
</nav>

<dialog id="mailDlg">
  <div style="padding:16px">
    <h2>メールから取り込み</h2>
    <p class="note" style="margin-top:0">メルカリの「取引が完了しました」「購入されました」メールの本文を貼り付けてください。複数件まとめて貼ってもOKです。商品IDが同じ商品は更新、新しい商品は「売却済」として追加します。</p>
    <textarea id="mailText" style="min-height:200px" placeholder="メール本文をここに貼り付け"></textarea>
    <p class="note" id="mailResult"></p>
    <div class="actions">
      <button class="btn" id="mailCancel" type="button">閉じる</button>
      <button class="btn primary" id="mailRun" type="button">取り込む</button>
    </div>
  </div>
</dialog>

<dialog id="dlg">
  <form id="itemForm">
    <h2 id="dlgTitle">商品を追加</h2>
    <label for="name">商品名 *</label>
    <input id="name" required maxlength="100">

    <div class="two">
      <div>
        <label for="market">販売先</label>
        <select id="market"></select>
      </div>
      <div>
        <label for="status">ステータス</label>
        <select id="status">
          <option value="stock">在庫</option>
          <option value="listed">出品中</option>
          <option value="sold">売却済</option>
        </select>
      </div>
    </div>

    <div class="two">
      <div>
        <label for="cost">仕入れ値（円）</label>
        <input id="cost" type="number" min="0" inputmode="numeric">
      </div>
      <div>
        <label for="price">出品価格（円）</label>
        <input id="price" type="number" min="0" inputmode="numeric">
      </div>
    </div>

    <div class="two">
      <div>
        <label for="shipping">送料（円）</label>
        <input id="shipping" type="number" min="0" inputmode="numeric">
      </div>
      <div>
        <label for="soldPrice">売却価格（円）</label>
        <input id="soldPrice" type="number" min="0" inputmode="numeric">
      </div>
    </div>

    <div class="two">
      <div>
        <label for="soldDate">売却日</label>
        <input id="soldDate" type="date">
      </div>
      <div>
        <label for="source">仕入れ先</label>
        <input id="source" maxlength="50">
      </div>
    </div>

    <label for="memo">メモ</label>
    <textarea id="memo" maxlength="500"></textarea>

    <div class="preview" id="preview"></div>

    <div class="actions">
      <button class="btn danger" id="del" type="button" hidden>削除</button>
      <span class="spacer"></span>
      <button class="btn" id="cancel" type="button">キャンセル</button>
      <button class="btn primary" type="submit">保存</button>
    </div>
  </form>
</dialog>

<script>
const KEY = 'seller-note-v1';
const MARKETS = { mercari: 'メルカリ', rakuma: '楽天ラクマ', yfleama: 'Yahoo!フリマ', yauction: 'Yahoo!オークション', other: 'その他' };
const STATUS = { stock: ['在庫', 'st-stock'], listed: ['出品中', 'st-listed'], sold: ['売却済', 'st-sold'] };
const DEFAULT_FEES = { mercari: 10, rakuma: 10, yfleama: 5, yauction: 10, other: 0 };

let db = load();
let editingId = null;

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.items)) return { items: d.items, fees: { ...DEFAULT_FEES, ...(d.fees || {}) } };
  } catch (e) { /* 壊れたデータは初期化 */ }
  return { items: [], fees: { ...DEFAULT_FEES } };
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(db));
  } catch (e) {
    alert('保存に失敗しました。ストレージの空き容量を確認してください。');
  }
}

const yen = n => (n == null || isNaN(n)) ? '—' : '¥' + Math.round(n).toLocaleString('ja-JP');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const numOrNull = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);
const monthKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const todayStr = () => { const d = new Date(); return `${monthKey(d)}-${String(d.getDate()).padStart(2, '0')}`; };

// 手数料 = 売価（売却済なら売却価格、それ以外は出品価格）× 販売先の手数料率
function feeOf(it) {
  const base = (it.status === 'sold' ? it.soldPrice : it.price) || 0;
  return Math.round(base * (db.fees[it.market] || 0) / 100);
}

// 利益 = 売価 − 手数料 − 送料 − 仕入れ値（売価が未入力なら null）
function profitOf(it) {
  const base = it.status === 'sold' ? it.soldPrice : it.price;
  if (base == null) return null;
  return base - feeOf(it) - (it.shipping || 0) - (it.cost || 0);
}

function renderHome() {
  const now = monthKey(new Date());
  const sold = db.items.filter(i => i.status === 'sold' && i.soldPrice != null);
  const monthSold = sold.filter(i => (i.soldDate || '').startsWith(now));
  const sum = (arr, fn) => arr.reduce((a, i) => a + (fn(i) || 0), 0);
  const totalProfit = sum(sold, profitOf);
  const totalSales = sum(sold, i => i.soldPrice);
  const stock = db.items.filter(i => i.status !== 'sold');
  const stats = [
    ['今月の利益', yen(sum(monthSold, profitOf)), sum(monthSold, profitOf) >= 0 ? 'pos' : 'neg'],
    ['今月の売上', yen(sum(monthSold, i => i.soldPrice)), ''],
    ['累計利益', yen(totalProfit), totalProfit >= 0 ? 'pos' : 'neg'],
    ['平均利益率', totalSales ? (totalProfit / totalSales * 100).toFixed(1) + '%' : '—', ''],
    ['在庫数', stock.length + '点', ''],
    ['在庫の仕入れ総額', yen(sum(stock, i => i.cost)), ''],
  ];
  document.getElementById('stats').innerHTML = stats.map(([l, v, c]) =>
    `<div class="card stat"><div class="l">${l}</div><div class="v ${c}">${v}</div></div>`).join('');

  const recent = [...sold].sort((a, b) => (b.soldDate || '').localeCompare(a.soldDate || '')).slice(0, 5);
  document.getElementById('recent').innerHTML = recent.length
    ? recent.map(i => `<div class="item" data-id="${i.id}"><div><div class="name">${esc(i.name)}</div><div class="tag">${esc(i.soldDate || '')} ・ ${esc(MARKETS[i.market])}</div></div><div class="r ${profitOf(i) >= 0 ? 'pos' : 'neg'}">利益 ${yen(profitOf(i))}</div></div>`).join('')
    : '<div class="empty">まだ売却済みの商品はありません</div>';
}

function renderList() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const f = document.getElementById('f').value;
  const items = db.items
    .filter(i => f === 'all' || i.status === f)
    .filter(i => !q || (i.name + ' ' + (i.source || '')).toLowerCase().includes(q))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  document.getElementById('list').innerHTML = items.length
    ? items.map(i => {
        const [label, cls] = STATUS[i.status];
        const p = profitOf(i);
        const sale = i.status === 'sold' ? `販売 ${yen(i.soldPrice)}` : (i.price != null ? `出品 ${yen(i.price)}` : '');
        return `<div class="item" data-id="${i.id}">
          <div><div class="name">${esc(i.name)}</div>
            <span class="tag ${cls}">${label}</span><span class="tag">${esc(MARKETS[i.market])}</span>${i.source ? `<span class="tag">${esc(i.source)}</span>` : ''}
          </div>
          <div class="r"><div>仕入 ${yen(i.cost)}</div><div>${sale}</div><div class="${p == null ? '' : p >= 0 ? 'pos' : 'neg'}">利益 ${yen(p)}</div></div>
        </div>`;
      }).join('')
    : '<div class="empty">該当する商品がありません</div>';
}

function renderSettings() {
  document.getElementById('fees').innerHTML = Object.entries(MARKETS).map(([k, name]) =>
    `<div class="fee-row"><span>${name}</span><input type="number" min="0" max="100" step="0.1" data-fee="${k}" value="${db.fees[k] ?? 0}"></div>`).join('');
}

function renderAll() { renderHome(); renderList(); renderSettings(); }

// フォーム
const form = document.getElementById('itemForm');
const dlg = document.getElementById('dlg');
const fields = ['name', 'market', 'status', 'cost', 'price', 'shipping', 'soldPrice', 'soldDate', 'source', 'memo'];

function fillMarkets() {
  document.getElementById('market').innerHTML = Object.entries(MARKETS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
}

function openForm(id) {
  editingId = id || null;
  const it = id ? db.items.find(i => i.id === id) : { status: 'stock', market: 'mercari' };
  if (!it) return;
  document.getElementById('dlgTitle').textContent = id ? '商品を編集' : '商品を追加';
  document.getElementById('del').hidden = !id;
  for (const k of fields) {
    const el = document.getElementById(k);
    el.value = it[k] ?? '';
  }
  updatePreview();
  dlg.showModal();
}

function readForm() {
  const v = {};
  for (const k of fields) v[k] = document.getElementById(k).value;
  return {
    name: v.name.trim(),
    market: v.market,
    status: v.status,
    cost: numOrNull(v.cost),
    price: numOrNull(v.price),
    shipping: numOrNull(v.shipping),
    soldPrice: numOrNull(v.soldPrice),
    soldDate: v.soldDate || '',
    source: v.source.trim(),
    memo: v.memo.trim(),
  };
}

function updatePreview() {
  const d = readForm();
  const it = { ...d, status: d.status, price: d.price, soldPrice: d.soldPrice };
  const p = profitOf(it);
  const base = d.status === 'sold' ? d.soldPrice : d.price;
  const rate = base ? (p / base * 100).toFixed(1) + '%' : '—';
  document.getElementById('preview').innerHTML =
    `手数料 ${yen(feeOf(it))} ・ 利益 <strong class="${p == null ? '' : p >= 0 ? 'pos' : 'neg'}">${yen(p)}</strong> ・ 利益率 ${rate}`;
}

fields.forEach(k => document.getElementById(k).addEventListener('input', updatePreview));
document.getElementById('status').addEventListener('change', updatePreview);
document.getElementById('market').addEventListener('change', updatePreview);

form.addEventListener('submit', e => {
  e.preventDefault();
  const d = readForm();
  if (!d.name) return;
  if (d.status === 'sold') {
    if (d.soldPrice == null) d.soldPrice = d.price;
    if (d.soldPrice == null) { alert('売却価格を入力してください'); return; }
    if (!d.soldDate) d.soldDate = todayStr();
  }
  if (editingId) {
    Object.assign(db.items.find(i => i.id === editingId), d);
  } else {
    db.items.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()), createdAt: Date.now(), ...d });
  }
  save();
  dlg.close();
  renderAll();
});

document.getElementById('cancel').addEventListener('click', () => dlg.close());
document.getElementById('del').addEventListener('click', () => {
  if (!editingId || !confirm('この商品を削除しますか？')) return;
  db.items = db.items.filter(i => i.id !== editingId);
  save();
  dlg.close();
  renderAll();
});

// 一覧・ホームのタップで編集
document.querySelectorAll('#recent, #list').forEach(el => el.addEventListener('click', e => {
  const row = e.target.closest('.item');
  if (row) openForm(row.dataset.id);
}));
document.getElementById('addBtn').addEventListener('click', () => openForm());
document.getElementById('q').addEventListener('input', renderList);
document.getElementById('f').addEventListener('change', renderList);

// 手数料設定
document.getElementById('fees').addEventListener('change', e => {
  const k = e.target.dataset.fee;
  if (!k) return;
  db.fees[k] = numOrNull(e.target.value) ?? 0;
  save();
  renderAll();
});

// ビュー切替
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === b.dataset.view));
  window.scrollTo(0, 0);
}));

// CSV書き出し（Excel向けにBOM付き）
document.getElementById('csv').addEventListener('click', () => {
  const head = ['商品名', 'ステータス', '販売先', '仕入れ先', '仕入れ値', '出品価格', '売却価格', '送料', '手数料', '利益', '売却日', 'メモ'];
  const rows = db.items.map(i => [
    i.name, STATUS[i.status][0], MARKETS[i.market], i.source, i.cost ?? '', i.price ?? '', i.soldPrice ?? '',
    i.shipping ?? '', feeOf(i), profitOf(i) ?? '', i.soldDate || '', i.memo,
  ]);
  const csv = [head, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: `seller-note-${todayStr()}.csv` });
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('すべての商品データを削除します。よろしいですか？')) return;
  db.items = [];
  save();
  renderAll();
});

// メルカリの通知メール本文から 商品ID・商品名・商品価格 を抜き出す
function parseMercariMail(text) {
  const re = /商品ID\s*[:：]\s*(m\d+)[\s\S]*?商品名\s*[:：]\s*([\s\S]*?)\s*商品価格\s*[:：]\s*([\d,]+)\s*円/g;
  const out = [];
  let m;
  while ((m = re.exec(text))) {
    out.push({ externalId: m[1], name: m[2].replace(/\s+/g, ' ').trim(), soldPrice: Number(m[3].replace(/,/g, '')) });
  }
  return out;
}

const mailDlg = document.getElementById('mailDlg');
document.getElementById('mailBtn').addEventListener('click', () => {
  document.getElementById('mailText').value = '';
  document.getElementById('mailResult').textContent = '';
  mailDlg.showModal();
});
document.getElementById('mailCancel').addEventListener('click', () => mailDlg.close());
document.getElementById('mailRun').addEventListener('click', () => {
  const found = parseMercariMail(document.getElementById('mailText').value);
  if (!found.length) {
    document.getElementById('mailResult').textContent = 'メルカリの商品情報が見つかりませんでした。メール本文をそのまま貼り付けてください。';
    return;
  }
  let added = 0, updated = 0;
  for (const f of found) {
    const ex = db.items.find(i => i.externalId === f.externalId);
    if (ex) {
      Object.assign(ex, { name: f.name, market: 'mercari', status: 'sold', soldPrice: f.soldPrice });
      if (!ex.soldDate) ex.soldDate = todayStr();
      updated++;
    } else {
      db.items.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        createdAt: Date.now(), externalId: f.externalId, name: f.name, market: 'mercari', status: 'sold',
        cost: null, price: f.soldPrice, soldPrice: f.soldPrice, shipping: null,
        soldDate: todayStr(), source: '', memo: 'メール取り込み',
      });
      added++;
    }
  }
  save();
  mailDlg.close();
  renderAll();
  alert(`${added}件追加、${updated}件更新しました。\n仕入れ値と送料は商品をタップして入力してください（未入力の間は利益が実際より多く表示されます）。`);
});

fillMarkets();
renderAll();
</script>
</body>
</html>
